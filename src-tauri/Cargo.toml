[package]
name = "sandbox-mio"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sandbox_mio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` gates the multi-webview API (bare `Window` + `add_child` + `Webview` geometry)
# used by the embedded workspace. Outside Tauri's semver guarantee: re-verify after any bump
# (docs/features/embedded-windows/02_dev.md).
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Optional so a release build can drop it with `--no-default-features` (see the `devtools`
# feature below); `lib.rs` only wires it up under `#[cfg(debug_assertions)]` regardless.
tauri-plugin-devtools = { version = "2.0.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
dirs = "6"
# Canonicalizes without Windows' `\\?\` UNC prefix, which `podman -v` does not understand.
dunce = "1"
thiserror = "2"
toml = "0.8"
sysinfo = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "native-tls"] }
sha2 = "0.10"
futures-util = "0.3"
# Structured backend logging. Events are captured by tauri-plugin-devtools (debug builds) and
# surface in its console; in release builds with no subscriber installed they are cheap no-ops.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
# Per-sandbox PASEO_PASSWORD minting for the agents web UI (docs/features/agent-web-ui/02_dev.md).
uuid = { version = "1", features = ["v4"] }
# The microsandbox proxy sidecar's `{SHA}` htpasswd entry
# (docs/features/microsandbox-network-policy/02_dev.md, Resolved Decision 7).
sha1 = "0.10"
base64 = "0.22"

[features]
default = []
# Pulls in tauri-plugin-devtools. Off by default: it enables tauri's `tracing` feature, which can
# deadlock the app on concurrent emits. `./build dev` adds it when `MIO_DEVTOOLS=1`.
devtools = ["dep:tauri-plugin-devtools"]
