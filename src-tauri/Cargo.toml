[package]
name = "sandbox-mio"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sandbox_mio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` gates the multi-webview API (bare `Window` + `add_child` + `Webview` geometry)
# used by the embedded workspace. Outside Tauri's semver guarantee: re-verify after any bump
# (docs/features/embedded-windows/02_dev.md).
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-devtools = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
dirs = "6"
thiserror = "2"
toml = "0.8"
sysinfo = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "native-tls"] }
sha2 = "0.10"
futures-util = "0.3"
# Structured backend logging. Events are captured by tauri-plugin-devtools (debug builds) and
# surface in its console; in release builds with no subscriber installed they are cheap no-ops.
tracing = "0.1"
