# The app crate is the workspace root; the subsystems that need no Tauri live in `crates/` so the
# compiler rejects a dependency cycle between them (docs/features/codebase-restructure/02_dev.md,
# Phase 6). `xtask/` at the repository root is deliberately not a member: it has its own workspace.
[workspace]
members = ["crates/*"]
# A bare `cargo check` or `cargo test` in this directory covers every crate, not just the app.
default-members = [".", "crates/*"]
resolver = "2"

# Versions shared by the app and the crates, so each external crate resolves to one specification.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
dirs = "6"
thiserror = "2"
tracing = "0.1"

[package]
name = "sandbox-mio"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sandbox_mio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tar = "0.4"

[dependencies]
mio-domain = { path = "crates/domain" }
mio-env = { path = "crates/env" }
mio-files = { path = "crates/files" }
mio-mockctl = { path = "crates/mockctl" }
mio-net-policy = { path = "crates/net-policy" }
mio-process = { path = "crates/process" }
mio-provider = { path = "crates/provider" }
# `unstable` gates the multi-webview API (bare `Window` + `add_child` + `Webview` geometry)
# used by the embedded workspace. Outside Tauri's semver guarantee: re-verify after any bump
# (docs/features/embedded-windows/02_dev.md).
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Held on 2.3 to match `@tauri-apps/plugin-clipboard-manager` `~2.3.3` in package.json: 2.4+
# requires a newer tauri/wry than this crate's `tauri = "2"` currently locks.
tauri-plugin-clipboard-manager = "~2.3"
# Optional so a release build can drop it with `--no-default-features` (see the `devtools`
# feature below); `lib.rs` only wires it up under `#[cfg(debug_assertions)]` regardless.
tauri-plugin-devtools = { version = "2.0.0", optional = true }
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
dirs.workspace = true
# Canonicalizes without Windows' `\\?\` UNC prefix, which `podman -v` does not understand.
dunce = "1"
thiserror.workspace = true
toml = "0.8"
sysinfo = "0.33"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "native-tls"] }
sha2 = "0.10"
tar = "0.4"
futures-util = "0.3"
# Structured backend logging. Events are captured by tauri-plugin-devtools (debug builds) and
# surface in its console; in release builds with no subscriber installed they are cheap no-ops.
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
# Per-sandbox PASEO_PASSWORD minting for the agents web UI (docs/features/agent-web-ui/02_dev.md).
uuid = { version = "1", features = ["v4"] }
# The per-sandbox iron-proxy CA, generated in-process
# (docs/features/podman-egress-boundary/02_dev.md, Resolved Decision 11).
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
time = { version = "0.3", features = ["parsing"] }
# The native terminal's in-process SSH client. `ring`, not the default aws-lc-rs, whose Windows build
# needs NASM (docs/features/native-terminal/02_dev.md, Resolved Decision 6).
russh = { version = "0.65.1", default-features = false, features = ["ring", "flate2", "rsa"] }

[features]
default = []
# Pulls in tauri-plugin-devtools. Off by default: it enables tauri's `tracing` feature, which can
# deadlock the app on concurrent emits. `cargo xtask dev` adds it when `MIO_DEVTOOLS=1`.
devtools = ["dep:tauri-plugin-devtools"]
