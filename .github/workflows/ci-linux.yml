name: ci-linux

# Proves the app builds and runs on Linux: one light-tier spec against the mock backend on a hosted
# Ubuntu runner. Separate from ci.yml so it can iterate without spending Windows runner minutes.
on:
  push:
    branches: [ci-linux]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  e2e-light-linux:
    name: e2e light spec (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # One spec while Linux support is new; drop to run the whole light tier.
      MIO_SPEC: sandbox-list-ui
    steps:
      - uses: actions/checkout@v4

      # Tauri's WebKitGTK build dependencies, plus WebKitWebDriver and a virtual display for the e2e run.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev build-essential pkg-config \
            webkit2gtk-driver xvfb

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # tauri-driver is a `cargo install`, cached with ~/.cargo/bin.
          cache-bin: true

      # Named build.exe on Linux too: `build/` is Vite's output directory, so `build` is taken.
      - name: Compile the build tool
        run: rustc build.rs -o build.exe

      - name: ./build ci e2e-light
        run: ./build.exe ci e2e-light

      - name: ./build ci diagnostics
        if: failure() || cancelled()
        run: ./build.exe ci diagnostics

      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: e2e-light-linux-diagnostics
          path: e2e-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
