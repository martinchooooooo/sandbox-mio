name: ci

# The root AGENTS.md Verification Commands that need no Podman machine, each job one `./build ci` step a
# developer can run locally. `standard`/`heavy` stay a developer cadence (AGENTS.md, Tier cadence).
# Runs only on a pushed tag (any name, so a `v*` release tag runs it alongside release.yml) or a
# manual dispatch, to keep Windows runner minutes down; branch pushes and pull requests do not run it.
on:
  push:
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per tag or dispatched ref; a re-push of the same tag queues behind the running one.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: Static checks and unit tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # package.json has no `packageManager` field, so the version must be given here.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `./build` is the root build.rs compiled with plain rustc; `build/` is Vite's output directory.
      - name: Compile the build tool
        run: rustc build.rs -o build.exe

      - name: ./build ci checks
        run: ./build.exe ci checks

  e2e-light:
    name: e2e light tier
    runs-on: windows-latest
    timeout-minutes: 60
    # TODO(T7): remove once three consecutive runs pass; until then a red light run is advisory.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compile the build tool
        run: rustc build.rs -o build.exe

      - name: ./build ci e2e-light
        run: ./build.exe ci e2e-light

      - name: ./build ci diagnostics
        if: failure() || cancelled()
        run: ./build.exe ci diagnostics

      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: e2e-light-diagnostics
          path: e2e-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
